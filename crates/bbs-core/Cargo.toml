[package]
name        = "bbs-core"
description = "Domain types, persistence, and business logic for Supply Drop BBS"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
repository.workspace   = true
rust-version.workspace = true
license-file = "../../LICENSE"
publish      = false

[dependencies]
# bbs-core implements the Host trait, so it depends on the
# contract crate. Plugins do too — but only one of them owns the
# concrete impl, and that's us.
bbs-plugin-api.workspace = true

argon2.workspace      = true
async-trait.workspace = true
fd-lock.workspace     = true
libc.workspace        = true
serde.workspace       = true
unicode-properties.workspace = true
uuid.workspace        = true
sqlx.workspace        = true
thiserror.workspace   = true
time.workspace        = true
tokio.workspace       = true
# Custom keymap files (GH #354 Phase 4) are plain TOML deserialized
# directly into bbs_plugin_api::Keymap via serde — config.toml's own
# read-modify-write editing stays on toml_edit below, which preserves
# comments/formatting that a typed round-trip through `toml` would lose.
toml.workspace        = true
toml_edit.workspace   = true
tracing.workspace     = true
zip.workspace         = true

# Free-space pre-flight (disk_space.rs). rustix is a safe wrapper, so the
# `unsafe_code = "forbid"` lint stays intact; it is already in the tree via
# tempfile.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", default-features = false, features = ["fs", "std"] }

[dev-dependencies]
proptest    = { workspace = true }
serde_json  = { workspace = true }
tempfile    = { workspace = true }
tokio       = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
