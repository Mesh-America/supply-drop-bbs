name: Release

# Fires when cargo-release pushes a version tag (e.g. v0.2.0).
on:
  push:
    tags:
      - "v[0-9]*"

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  # Release builds must be warning-free.
  RUSTFLAGS: -D warnings

jobs:
  # ─── Build release binaries for all deployment targets ─────────────
  build:
    name: Build · ${{ matrix.target }}
    # `cross` (see the "Install cross" step below) compiles every target
    # inside a ghcr.io/cross-rs Docker image, not on this runner directly —
    # so the runner's own OS/glibc no longer becomes the minimum glibc
    # release binaries require. That's the fix for supply-drop-bbs-7je /
    # #238, where an unpinned `ubuntu-latest` runner floated from glibc
    # 2.35 to 2.39 and silently broke `install.sh`'s binary download on
    # Raspberry Pi OS Bookworm (glibc 2.36). cross@0.2.5's images (verified
    # against its Dockerfiles at that exact tag) are Ubuntu 16.04-based —
    # glibc 2.23 for all three targets here, well under both Bookworm's
    # 2.36 and the old ubuntu-22.04 pin's 2.35 (these numbers are NOT the
    # same value, just both comfortably under the 2.36 ceiling that
    # actually matters) — without needing a runner-image pin at all.
    #
    # `runs-on` can therefore float on ubuntu-latest again: the GLIBC FLOOR
    # specifically is now pinned at the Docker-image level (via the `cross`
    # tool version below), not tied to the runner OS. This also sidesteps
    # GitHub's ubuntu-22.04 deprecation brownouts, which begin 2026-09-17
    # and intentionally fail any job still pinned to that runner image
    # (actions/runner-images#14254) — pinning runs-on to ubuntu-22.04 today
    # would start failing release builds within days.
    #
    # This is NOT full independence from the runner image, only from its
    # glibc: the aarch64/armv7 builds still run through cross-rs's own
    # QEMU-based emulation inside Docker, and Docker/QEMU-level breakage
    # from a runner-image bump is a real, precedented failure mode
    # (actions/runner-images#11589 — a QEMU segfault broke a Docker build
    # purely from a same-label ubuntu-24.04 image version bump, no workflow
    # change). Smaller, more contained surface than the glibc drift this
    # migration fixes, but not zero.
    #
    # Residual risk (accepted, tracked): cross@0.2.5 pins the `cross` CLI
    # version, but the Docker images it pulls are resolved by tag, not
    # content digest — a compromised/repointed ghcr.io/cross-rs tag could
    # inject into the bind-mounted source tree with nothing here to catch
    # it (SHA256SUMS is generated from whatever the build already produced).
    # Consistent with this repo's existing accepted-risk stance on
    # unverified git/pip content elsewhere (install.sh) — see
    # supply-drop-bbs-9bs. Digest-pinning is tracked separately
    # (supply-drop-bbs-kmt / #265) rather than rushed in here.
    runs-on: ubuntu-latest
    # Bumped from 60: each matrix job now also pulls a multi-hundred-MB
    # cross-rs Docker image per build invocation (2 per target — full and
    # headless) on top of the existing compile time. Not measured against a
    # real run yet (this workflow only fires on release tags, no dry-run
    # trigger) — treat as a conservative estimate to revisit after the
    # first real release under this pipeline.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          - x86_64-unknown-linux-gnu

    # Least-privilege default for a job that now hands the checked-out tree
    # (see persist-credentials below) to a third-party Docker container.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so git-cliff can generate release notes.
          fetch-depth: 0
          # `cross` bind-mounts the whole working tree, .git included, into
          # its build container (see the Docker-image residual-risk note
          # above) — don't hand a real GITHUB_TOKEN to that container. This
          # job never pushes back to the repo, so it doesn't need one.
          persist-credentials: false

      # This pin and cross@0.2.5's own supported-Rust-version range (above)
      # aren't verified against each other anywhere — if this toolchain is
      # bumped without checking cross@0.2.5 compatibility, the failure mode
      # is unverified (could be a clear compile error inside the container,
      # or something subtler). Check both together when bumping either.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"
          targets: ${{ matrix.target }}

      # Provides the per-target ghcr.io/cross-rs/<target> Docker images
      # (glibc 2.23, Ubuntu 16.04-based — see the `build` job's comment
      # above) that the `cross build` calls below compile in. Version
      # pinned for reproducibility; bump deliberately, not silently.
      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross@0.2.5

      # Cache key carries a `cross-v1` salt, deliberately different from
      # this job's pre-migration key (`release-${{ matrix.target }}`): the
      # cache is populated by whatever built last, and Cargo does not
      # reliably detect that a *build backend* changed (rust-lang/cargo#12502)
      # the way it detects source changes. Without a fresh key here, the
      # first release built after this migration could restore a cache
      # populated by the OLD native `cargo build` and skip re-linking
      # inside the `cross` container entirely — silently shipping a
      # host-glibc-linked binary under the new pipeline, reintroducing the
      # exact #238 defect this migration exists to fix. Bump the salt again
      # any time the build moves between native and containerized (or
      # between container images), not just when dependencies change.
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-cross-v1-${{ matrix.target }}

      # ── Build variants ─────────────────────────────────────────────
      # Uses the `release-min` profile (Cargo.toml):
      #   opt-level = "z", lto = "fat", codegen-units = 1, strip = "symbols"
      # Output lands in  target/<triple>/release-min/
      #
      # IMPORTANT: stage the full binary before starting the headless build.
      # Both variants produce  target/<triple>/release-min/supply-drop-bbs;
      # the second build overwrites the first, so we must copy before building.
      # `cross` bind-mounts the project dir at this same host-visible path
      # (verified against its mount-finder source), so this still holds —
      # the container writes to the mount, it doesn't keep its own copy.
      #
      # x86_64-unknown-linux-gnu — the runner's own native architecture —
      # is built through `cross`/Docker here too, not natively, even though
      # that adds a new failure dependency (image pull/registry/daemon) a
      # native build wouldn't have had. Deliberate: the goal is one known,
      # uniform glibc floor across all three targets, not "native arch gets
      # whatever the runner happens to ship" — the latter is the exact
      # failure mode (#238) this migration exists to close off.

      # 1. Full binary (default features = cli + both mesh transports + process-transport + admin-web)
      - name: Build — full (default features)
        run: cross build --profile release-min --target ${{ matrix.target }}

      - name: Stage full binary
        env:
          # Routed through env, not interpolated directly into the script
          # below (`TAG="${{ github.ref_name }}"`) — a tag name is operator-
          # controlled (anyone with tag-push access sets it) and GitHub
          # substitutes ${{ }} expressions into the YAML *before* bash ever
          # sees it, so a tag containing e.g. $(...) or backticks would be
          # executed as shell, not treated as a literal string. This is
          # GitHub's own documented script-injection anti-pattern — see
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable.
          # Confirmed exploitable here via a hostile-audit repro before this
          # fix (a tag like v1.0.0$(...) matches this workflow's own
          # `v[0-9]*` trigger). $TAG below is a real environment variable,
          # which bash never re-interprets as script source.
          TAG: ${{ github.ref_name }}
        run: |
          TARGET="${{ matrix.target }}"
          mkdir -p dist
          cp "target/${TARGET}/release-min/supply-drop-bbs" \
             "dist/supply-drop-bbs-${TAG}-${TARGET}"

      # Package the full binary as a .deb for Debian/Ubuntu/Raspberry Pi OS.
      # The headless variant is intentionally not packaged — operators who need
      # it can use the raw binary. The .deb installs to the standard paths and
      # wires up the systemd unit without requiring a cloned repo or root curl.
      - name: Package as .deb
        # TAG via env, not interpolated directly — see "Stage full binary"'s
        # env block above for why (script-injection via a hostile tag name).
        env:
          TAG: ${{ github.ref_name }}
        run: |
          TARGET="${{ matrix.target }}"
          VERSION="${TAG#v}"

          case "$TARGET" in
            aarch64-unknown-linux-gnu)     DEB_ARCH=arm64 ;;
            armv7-unknown-linux-gnueabihf) DEB_ARCH=armhf ;;
            x86_64-unknown-linux-gnu)      DEB_ARCH=amd64 ;;
          esac

          # Build tree uses versioned name (good for dpkg-deb internals);
          # the output .deb is renamed to the unversioned form so that
          # GitHub's /releases/latest/download/<file> static URL works —
          # operators can always curl the same URL regardless of version.
          PKG="supply-drop-bbs_${VERSION}_${DEB_ARCH}"
          DEB_OUT="supply-drop-bbs_${DEB_ARCH}.deb"

          mkdir -p "${PKG}/DEBIAN"
          mkdir -p "${PKG}/usr/local/bin"
          mkdir -p "${PKG}/lib/systemd/system"
          mkdir -p "${PKG}/lib/udev/rules.d"
          mkdir -p "${PKG}/etc/supply-drop-bbs"
          mkdir -p "${PKG}/var/lib/supply-drop-bbs"
          mkdir -p "${PKG}/usr/share/supply-drop-bbs/pymc-companion"

          # Binary
          cp "dist/supply-drop-bbs-${TAG}-${TARGET}" \
             "${PKG}/usr/local/bin/supply-drop-bbs"
          chmod 755 "${PKG}/usr/local/bin/supply-drop-bbs"

          # Systemd service unit
          cp supply-drop-bbs.service \
             "${PKG}/lib/systemd/system/supply-drop-bbs.service"

          # udev rule — grants the service serial-port access across distros
          cp packaging/70-supply-drop-bbs.rules \
             "${PKG}/lib/udev/rules.d/70-supply-drop-bbs.rules"

          # pymc-companion (MeshCore Pi HAT bridge) script + unit, bundled so
          # postinst can self-update an already-configured HAT bridge on
          # every future .deb upgrade with no cloned repo available (see
          # supply-drop-bbs-536 / #243) — not used for first-time HAT setup,
          # which still goes through install.sh's guided wizard.
          cp contrib/pymc-companion/pymc-companion.py \
             "${PKG}/usr/share/supply-drop-bbs/pymc-companion/pymc-companion.py"
          cp contrib/pymc-companion/pymc-companion.service \
             "${PKG}/usr/share/supply-drop-bbs/pymc-companion/pymc-companion.service"

          # control — dpkg extended description continuation lines need exactly
          # one leading space, which is produced here by the YAML indentation.
          cat > "${PKG}/DEBIAN/control" <<EOF
          Package: supply-drop-bbs
          Version: ${VERSION}
          Architecture: ${DEB_ARCH}
          Maintainer: Mesh America <hello@meshamerica.com>
          Depends: systemd
          Section: net
          Priority: optional
          Description: Bulletin-board system for LoRa mesh networks
           Supply Drop BBS is a bulletin-board server for LoRa mesh networks.
           It supports MeshCore and Meshtastic transports and includes an
           optional admin web UI for sysop administration.
          EOF

          cp packaging/postinst "${PKG}/DEBIAN/postinst"
          cp packaging/prerm    "${PKG}/DEBIAN/prerm"
          chmod 755 "${PKG}/DEBIAN/postinst" "${PKG}/DEBIAN/prerm"

          dpkg-deb --build --root-owner-group "${PKG}"
          mv "${PKG}.deb" "dist/${DEB_OUT}"

      # 2. Headless — no admin web UI; smaller binary for resource-constrained nodes
      - name: Build — headless (cli + mesh, no web)
        run: |
          cross build --profile release-min --target ${{ matrix.target }} \
            --no-default-features --features transport-cli,transport-mesh

      - name: Stage headless binary
        # TAG via env, not interpolated directly — see "Stage full binary"'s
        # env block above for why (script-injection via a hostile tag name).
        env:
          TAG: ${{ github.ref_name }}
        run: |
          TARGET="${{ matrix.target }}"
          cp "target/${TARGET}/release-min/supply-drop-bbs" \
             "dist/supply-drop-bbs-${TAG}-${TARGET}-headless"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  # ─── Create the GitHub Release ─────────────────────────────────────
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write   # needed to create the release and upload assets

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      # Generate release notes for this tag only (not the full changelog).
      # --latest  : scope to the most recent tag pair (previous..this)
      # --strip header : omit the "# Changelog" banner — just the section body
      - name: Generate release notes
        run: |
          git cliff --latest --strip header --output release-notes.md
          cat release-notes.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      # Generate a SHA256SUMS file so install.sh can verify downloads.
      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "supply-drop-bbs ${{ github.ref_name }}"
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            dist/*
